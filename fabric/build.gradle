plugins {
    id "fabric-loom" version "${fabric_loom_version}"
    id "java"
}

repositories {
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.maxhenkel.de/repository/public" }
}

group = project.maven_group
version = project.mod_version

loom {
    mixin.useLegacyMixinAp = false

    runs {
        client {
            client()
            programArgs("--username", "Dev1")
        }

        client2 {
            client()
            configName = "Fabric Client 2 (Dev2)"
            runDir("run/client2")
            programArgs("--username", "Dev2")
        }

        server {
            server()
            runDir("run/server")
            programArgs("--nogui")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "maven.modrinth:motion-capture:${mod_mocap_version}-fabric-${minecraft_version}"

    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_version}"

    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${minecraft_version}-${voicechat_version}"

    modRuntimeOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_version}:fabric-stub"
    
    implementation project(path: ':common', configuration: 'namedElements')
}

jar {
    exclude "icon.psd"
}