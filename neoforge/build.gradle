plugins {
    id "net.neoforged.moddev" version "${neoforge_moddev_version}"
    id "java"
}

repositories {
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.maxhenkel.de/repository/public" }
}

group = project.maven_group
version = project.mod_version

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
            programArguments.addAll("--username", "Dev1")
        }

        client2 {
            client()
            ideName = "NeoForge Client 2 (Dev2)"
            gameDirectory = file("run/client2")
            programArguments.addAll("--username", "Dev2")
        }

        server {
            server()
            gameDirectory = file("run/server")
            programArguments.addAll("--nogui")
        }
    }
    
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation project(path: ':common', configuration: 'namedElements')
    api project(":common")
    implementation "maven.modrinth:motion-capture:${mod_mocap_version}-neoforge-${minecraft_version}"

    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_version}"

    runtimeOnly "maven.modrinth:simple-voice-chat:neoforge-${minecraft_version}-${voicechat_version}"
}

jar {
    exclude "icon.psd"
}